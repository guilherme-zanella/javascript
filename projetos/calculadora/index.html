<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/f96e3099c2.js" crossorigin="anonymous"></script>
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="calculadora">
        <div id="historico" class="normal">
            <p>Sem histórico!</p>
        </div>
        <div id="menu">
            <ul>
                <li onclick="historico()" id="botao_his"><i class="fa-solid fa-clock-rotate-left"></i></li>
                <li onclick="tema()" id="tema"><i class="fa-solid fa-sun"></i></li>
            </ul>
        </div>

        <div id="calculo" class="normal">
            <div id="conta"></div>
            <button onclick="apagar()"><i class="fa-solid fa-delete-left"></i></button>
        </div>

        <input type="button" value="7" class="numero">
        <input type="button" value="8" class="numero">
        <input type="button" value="9" class="numero">
        <input type="button" value="/" class="operacao">

        <input type="button" value="4" class="numero">
        <input type="button" value="5" class="numero">
        <input type="button" value="6" class="numero">
        <input type="button" value="*" class="operacao">

        <input type="button" value="1" class="numero">
        <input type="button" value="2" class="numero">
        <input type="button" value="3" class="numero">
        <input type="button" value="-" class="operacao">

        <input type="button" value="=" id="igual" onclick="igual()" >
        <input type="button" value="0" class="numero">
        <input type="button" value="." class="numero">
        <input type="button" value="+" class="operacao">
    </main>
    <script src="script.js"></script>
</body>
</html>
