<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de JavaScript</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    
    <script>
        let nome = window.prompt('Qual é o seu nome? ')
        document.write(`Olá, <strong>${nome}</strong>! Seu nome tem ${nome.length} letras.<br>`)
        document.write(`Seu nome em maiúsculas fica ${nome.toUpperCase()}.<br>`)
        document.write(`Seu nome em minúsculas fica ${nome.toLowerCase()}`)
        // Formatar moeda: n1.toLocaleString('pt-BR', {style: 'currency', currency: 'brl'})
    </script>
</body>
</html>
