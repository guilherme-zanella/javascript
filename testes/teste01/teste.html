<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergunta</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: pink;
            height: 100vh;
        }

        main {
            display: flex;
            flex-flow: column nowrap;
            justify-content: center;
            align-items: center;
        }

        h1 {
            width: 100%;
            text-align: center;
        }

        button {
            padding: 10px;
        }

        img {
            display: none;
            width: 100%;
            max-width: 700px;
        }
    </style>
</head>
<body>
    <main>
        <h1 id="titulo">Quem é o melhor irmão do mundo?</h1>
        <div id="respostas">
            <button id="sim" onclick="certo()">Guilherme</button>
            <button id="nao" onmouseenter="errado()" onclick="errado()">Pingo</button>
        </div>
        <img src="Coracoes.png" alt="coração" id="coracao">
    </main>

    <script>
        const botao_errado = document.getElementById('nao')
        const botao_certo = document.getElementById('sim')

        function sortear(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min
        }
        
        function errado() {
            botao_errado.style.position = 'absolute'
            botao_errado.style.left = `${sortear(10,90)}%`
            botao_errado.style.top = `${sortear(130, 300)}px`
        }

        function certo() {
            botao_certo.style.display = 'none'
            botao_errado.style.display = 'none'
            document.getElementById('titulo').innerText = 'Eu sei que você me ama 😂'
            const coracao = document.getElementById('coracao')
            coracao.style.display = 'block'
        }
    </script>
</body>
</html>
